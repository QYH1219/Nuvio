name: Feature request
description: Suggest a new wallpaper workflow or setting
title: "[feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. Please describe the user problem first, then
        the proposed behavior. Do not attach copyrighted wallpaper files.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard or missing today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: What should the app do instead?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Wallpaper library / import
        - Settings UI
        - Performance
        - Codex injection
        - Documentation
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
      placeholder: "0.2.0 or commit hash"
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional; existing tools or workarounds.
