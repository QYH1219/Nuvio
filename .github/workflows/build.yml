name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  windows-launcher:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Test Windows configuration and launcher paths
        run: node --test test/magpie-config.test.mjs test/magpie-preflight.test.mjs test/launcher.test.mjs
      - name: Parse compatibility scripts with Windows PowerShell 5.1
        shell: powershell
        run: |
          Get-ChildItem tools/compat/*.ps1 | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors)
            if ($parseErrors.Count) { throw ($parseErrors.Message -join '; ') }
          }
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build preview and injection bundle
        run: npm run build:all

      - name: Verify no private assets in build output
        run: npm run check:dist

      - name: Unit tests
        run: npm test

      - name: Syntax check tools
        run: |
          for file in tools/*.mjs; do
            echo "checking $file"
            node --check "$file"
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: codex-dynamic-bg-dist
          path: |
            dist
            dist-embed
          if-no-files-found: error
          retention-days: 14

