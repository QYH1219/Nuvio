name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build preview and injection bundle
        run: npm run build:all

      - name: Verify no private assets in build output
        run: npm run check:dist

      - name: Unit tests
        run: npm test

      - name: Syntax check tools
        run: |
          node --check tools/inject.mjs
          node --check tools/restore.mjs
          node --check tools/doctor.mjs
          node --check tools/cleanup-expression.mjs
          node --check tools/start.mjs
          node --check tools/sync-decoders.mjs

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: codex-dynamic-bg-dist
          path: |
            dist
            dist-embed
          if-no-files-found: error
          retention-days: 14

