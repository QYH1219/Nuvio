name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build:all

      - name: Test
        run: npm test

      - name: Verify public build
        run: npm run check:dist

      - name: Bundle Windows Node runtime
        run: |
          mkdir -p runtime
          curl -fsSL -o runtime/node.exe https://nodejs.org/dist/latest-v22.x/win-x64/node.exe
          curl -fsSL -o runtime/LICENSE https://nodejs.org/dist/latest-v22.x/LICENSE
          test -s runtime/node.exe

      - name: Package portable release
        run: npm run pack

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/nuvio-*-portable.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
